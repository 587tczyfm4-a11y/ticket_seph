name: Check SEPHORiA resale tickets
 
on:
  schedule:
    # Toutes les 5 minutes (GitHub Actions ne garantit pas la précision exacte)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
 
      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_tickets.py
 
